  <rect x="266" y="248" width="60" height="6" rx="3" fill="#8ea6cf"/>
  <rect x="452" y="238" width="14" height="14" fill="#8ea6cf"/>
  <rect x="434" y="248" width="50" height="6" rx="3" fill="#8ea6cf"/>

