<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" fill="none" role="img" aria-label="Developer workstation with three screens and streaming code">
  <style>
    .bar { transform-box: fill-box; transform-origin: left center; animation: stream 2.7s ease-in-out infinite; }
    @keyframes stream { 0% { transform: scaleX(.14); opacity:.35 } 45% { transform: scaleX(1); opacity:1 } 76% { transform: scaleX(1); opacity:1 } 100% { transform: scaleX(.14); opacity:.35 } }
    @keyframes sL { to { transform: translateY(-66px) } }
    @keyframes sM { to { transform: translateY(-84px) } }
    @keyframes sR { to { transform: translateY(-66px) } }
    .scL { animation: sL 6s linear infinite; }
    .scM { animation: sM 5s linear infinite; }
    .scR { animation: sR 7.5s linear infinite; }
    @keyframes blink { 0%,45% { opacity:1 } 55%,100% { opacity:0 } }
    .cur { animation: blink 1s step-end infinite; }
    @media (prefers-reduced-motion: reduce) {
      .bar,.scL,.scM,.scR,.cur { animation: none; }
      .bar { transform: none; opacity: 1; }
    }
  </style>

  <defs>
    <clipPath id="cL"><rect x="78" y="158" width="104" height="76" rx="3"/></clipPath>
    <clipPath id="cM"><rect x="228" y="143" width="134" height="92" rx="3"/></clipPath>
    <clipPath id="cR"><rect x="408" y="158" width="104" height="76" rx="3"/></clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="300" cy="415" rx="220" ry="13" fill="#b9c6dd" opacity="0.4"/>

  <!-- streaming code lines above the machines -->
  <g>
    <rect class="bar" style="animation-delay:0.00s" x="262" y="52" width="150" height="5" rx="2.5" fill="#a9c9f5"/>
    <rect class="bar" style="animation-delay:0.17s" x="316" y="60" width="96" height="5" rx="2.5" fill="#4c8bf5"/>
    <rect class="bar" style="animation-delay:0.34s" x="284" y="68" width="128" height="5" rx="2.5" fill="#d6e4fb"/>
    <rect class="bar" style="animation-delay:0.51s" x="352" y="76" width="60" height="5" rx="2.5" fill="#a9c9f5"/>
    <rect class="bar" style="animation-delay:0.68s" x="300" y="84" width="112" height="5" rx="2.5" fill="#4c8bf5"/>
    <rect class="bar" style="animation-delay:0.85s" x="368" y="92" width="44" height="5" rx="2.5" fill="#d6e4fb"/>
    <rect class="bar" style="animation-delay:1.02s" x="328" y="100" width="84" height="5" rx="2.5" fill="#a9c9f5"/>
    <rect class="bar" style="animation-delay:1.19s" x="342" y="108" width="70" height="5" rx="2.5" fill="#4c8bf5"/>
    <rect class="bar" style="animation-delay:1.36s" x="292" y="116" width="120" height="5" rx="2.5" fill="#d6e4fb"/>
    <rect class="bar" style="animation-delay:1.53s" x="360" y="124" width="52" height="5" rx="2.5" fill="#a9c9f5"/>
  </g>

  <!-- desk -->
  <rect x="34" y="250" width="532" height="14" rx="3" fill="#b9cdf0"/>
  <rect x="34" y="263" width="532" height="6" rx="3" fill="#a6bce8"/>
  <rect x="70" y="268" width="10" height="150" rx="3" fill="#9aa6b8"/>
  <rect x="520" y="268" width="10" height="150" rx="3" fill="#9aa6b8"/>
  <rect x="60" y="414" width="30" height="7" rx="3" fill="#9aa6b8"/>
