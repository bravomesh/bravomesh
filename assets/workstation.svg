      <rect x="247" y="224" width="60" height="4" rx="2.0" fill="#7dcfff"/>
      <rect x="235" y="236" width="96" height="4" rx="2.0" fill="#7aa2f7"/>
      <rect x="245" y="248" width="50" height="4" rx="2.0" fill="#9ece6a"/>
      <rect x="235" y="260" width="120" height="4" rx="2.0" fill="#e0af68"/>
