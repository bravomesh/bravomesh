      <rect x="85" y="233" width="58" height="4" rx="2.0" fill="#2b3a52"/>
      <rect x="95" y="244" width="34" height="4" rx="2.0" fill="#2b3a52"/>
      <rect x="85" y="255" width="74" height="4" rx="2.0" fill="#2b3a52"/>
      <rect x="101" y="266" width="44" height="4" rx="2.0" fill="#2b3a52"/>
      <rect x="91" y="277" width="22" height="4" rx="2.0" fill="#2b3a52"/>
      <rect x="85" y="288" width="64" height="4" rx="2.0" fill="#2b3a52"/>
  </g></g>

