      <rect x="415" y="222" width="54" height="4" rx="2.0" fill="#7aa2f7"/>
      <rect x="415" y="233" width="60" height="4" rx="2.0" fill="#7dcfff"/>
      <rect x="425" y="244" width="80" height="4" rx="2.0" fill="#7aa2f7"/>
      <rect x="415" y="255" width="40" height="4" rx="2.0" fill="#9ece6a"/>
      <rect x="431" y="266" width="68" height="4" rx="2.0" fill="#7dcfff"/>
      <rect x="421" y="277" width="30" height="4" rx="2.0" fill="#e0af68"/>
      <rect x="415" y="288" width="54" height="4" rx="2.0" fill="#7aa2f7"/>
  </g></g>
  <g clip-path="url(#cR)">
    <polyline points="413,222 425,214 437,218 449,206 461,212 473,200 485,208 501,198" fill="none" stroke="#7dcfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- keyboard + mouse -->
