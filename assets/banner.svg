<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Meshack Kibet — systems and geospatial developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="fade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#0d1117" stop-opacity="0.55"/>
      <stop offset="0.9" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="300" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="300" fill="url(#bg)"/>

    <!-- graticule / globe motif -->
    <g transform="translate(1040 150)" fill="none" stroke="#1f6feb" stroke-width="1" opacity="0.28">
      <circle r="158"/>
      <ellipse rx="158" ry="54"/>
      <ellipse rx="158" ry="108"/>
      <ellipse rx="54" ry="158"/>
      <ellipse rx="108" ry="158"/>
      <line x1="-158" y1="0" x2="158" y2="0"/>
      <line x1="0" y1="-158" x2="0" y2="158"/>
    </g>
    <g fill="#58a6ff">
      <circle cx="1006" cy="96" r="3"/>
      <circle cx="1128" cy="150" r="3"/>
      <circle cx="1050" cy="214" r="2.6"/>
      <circle cx="980" cy="182" r="2.2"/>
    </g>
    <g stroke="#58a6ff" stroke-width="1" opacity="0.4">
      <line x1="1006" y1="96" x2="1128" y2="150"/>
      <line x1="1128" y1="150" x2="1050" y2="214"/>
      <line x1="1050" y1="214" x2="980" y2="182"/>
    </g>

    <rect width="1280" height="300" fill="url(#fade)"/>

    <!-- text -->
    <text x="72" y="86" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace"
      font-size="12.5" letter-spacing="4.5" fill="#58a6ff">SYSTEMS &#160;·&#160; GEOSPATIAL &#160;·&#160; DATA PIPELINES</text>

    <text x="70" y="158" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif"
      font-size="62" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Meshack Kibet</text>

    <rect x="72" y="180" width="66" height="3" fill="#1f6feb"/>

    <text x="72" y="222" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif"
      font-size="19" font-style="italic" fill="#8b949e">Full-stack web platforms and the geospatial</text>
    <text x="72" y="250" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif"
      font-size="19" font-style="italic" fill="#8b949e">data pipelines behind them.</text>

    <text x="74" y="284" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace"
      font-size="11.5" letter-spacing="1.5" fill="#6e7681">Nairobi, Kenya</text>
  </g>
</svg>
